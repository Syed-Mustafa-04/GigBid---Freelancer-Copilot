[project]
name = "gigbid"
version = "1.0.0"
description = "GigBid - a multi-agent freelancer copilot (AI-4016 R&D assignment)"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.118.0",
  "uvicorn[standard]==0.37.0",
  "pydantic==2.11.9",
  # Required by pydantic's EmailStr, which apps/api/routers/core.py uses for the
  # register and login payloads. It arrived in the dev venv as somebody else's
  # transitive dependency and was never declared, so every local run worked and
  # the first clean container died at import with "No module named
  # 'email_validator'".
  "email-validator==2.4.0",
  "pydantic-settings==2.11.0",
  "pyyaml==6.0.2",
  "httpx==0.28.1",
  "python-dotenv==1.1.1",
  "langgraph==0.6.8",
  "langgraph-checkpoint-sqlite==2.0.11",
  # Pinned: aiosqlite 0.21+ drops the Thread base that langgraph's AsyncSqliteSaver needs.
  "aiosqlite==0.20.0",
  "langgraph-checkpoint-postgres==2.0.24",
  "langchain-core==0.3.78",
  "langchain-mcp-adapters==0.1.10",
  "mcp==1.16.0",
  "sqlalchemy==2.0.44",
  "psycopg[binary]==3.2.10",
  "alembic==1.16.5",
  "redis==6.4.0",
  "celery==5.5.3",
  "numpy==2.3.3",
  "rank-bm25==0.2.2",
  "python-jose[cryptography]==3.5.0",
  "passlib[bcrypt]==1.7.4",
  "python-multipart==0.0.20",
  "sse-starlette==3.0.2",
  "tenacity==9.1.2",
  "orjson==3.11.3",
  "cryptography==46.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "pytest-asyncio==1.2.0",
  "pytest-cov==7.0.0",
  "ruff==0.14.0",
  "mypy==1.18.2",
  "respx==0.22.0",
]
embed = [
  "sentence-transformers==5.1.1",
  "torch==2.8.0",
]
trace = [
  "langfuse==3.6.1",
]
data = [
  "pandas==2.3.3",
  "kaggle==1.7.4.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agent", "rag", "gigsim", "mcp_servers", "worker", "evals", "apps"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
