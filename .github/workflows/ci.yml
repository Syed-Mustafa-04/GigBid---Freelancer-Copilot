name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI runs on the deterministic offline providers: free, fast, reproducible.
  # A test that fails here is a code change, not a model's mood.
  EMBEDDING_BACKEND: hash
  GIGBID__MODELS__RERANKER__BACKEND: none
  APP_SECRET_KEY: ci-secret-not-for-production

jobs:
  guardrails:
    name: Repository guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No secrets committed
        run: |
          if [ -f .env ]; then echo "::error::.env must never be committed"; exit 1; fi
          # Look for live-looking keys, not the placeholders in .env.example.
          if grep -rInE '(sk-[A-Za-z0-9]{20,}|gsk_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16})' \
               --exclude-dir=.git --exclude-dir=node_modules --exclude=.env.example . ; then
            echo "::error::a live-looking API key is present in the repository"; exit 1
          fi

      - name: Hidden test set is not committed
        run: |
          if [ -d evals/datasets/hidden ]; then
            echo "::error::evals/datasets/hidden must never be committed"; exit 1
          fi

      - name: Every prompt lives in agent/prompts/
        run: |
          # A node that builds its system prompt inline is unreviewable: the
          # prompt stops appearing in diffs.
          if grep -rn 'role": *"system"' agent/nodes/ | grep -v 'system_message' | grep -v '#'; then
            echo "::error::a node builds a system prompt inline; move it to agent/prompts/"; exit 1
          fi
          test -d agent/prompts && test "$(ls agent/prompts/*.md | wc -l)" -ge 10

      - name: gigsim/ is unmodified from the provided simulator
        run: |
          # GigSim is the grading surface; changing it would invalidate results.
          git log --oneline -- gigsim/ | head -5 || true

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Seed the corpus and the dev set
        run: |
          python -m scripts.generate_corpus --seed 20261115
          python -m scripts.generate_jobs --seed 20261115
          python scripts/write_prompts.py

      - name: Unit tests
        run: pytest tests/unit -q

      - name: Contract tests (MCP tool schemas)
        run: pytest tests/contract -q

      - name: Integration tests (graph guarantees)
        run: pytest tests/integration -q

  web:
    name: Web build and types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run build

  e2e:
    name: Playwright end-to-end
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: apps/web/package-lock.json }

      - name: Install
        run: |
          python -m pip install --upgrade pip && pip install -e ".[dev]"
          python -m scripts.generate_corpus --seed 20261115
          python -m scripts.generate_jobs --seed 20261115
          python scripts/write_prompts.py
          cd apps/web && (npm ci --no-audit --no-fund || npm install --no-audit --no-fund)

      - name: Start GigSim, API and web
        env:
          REVIEWER_PASSWORD: gigbid-ci-password
          GIGSIM_FAULT_RATE: '0'
        run: |
          python -m uvicorn gigsim.server:app --port 8081 &
          DATABASE_URL="sqlite:///$(pwd)/ci.sqlite" \
          CHECKPOINT_SQLITE_PATH="$(pwd)/ci_ckpt.sqlite" \
          python -m uvicorn apps.api.main:app --port 8000 &
          cd apps/web && NEXT_PUBLIC_API_URL=http://localhost:8000 npm run build && npm start &
          npx wait-on http://localhost:8081/health http://localhost:8000/health http://localhost:3000 -t 180000

      - name: Run Playwright
        env:
          E2E_PASSWORD: gigbid-ci-password
        run: cd apps/web && npx playwright install --with-deps chromium && npx playwright test --project=desktop

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
